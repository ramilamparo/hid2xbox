name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -v -count=1 -run "Test(Config|Normalize|Norm|Button|Contain)" ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -v -count=1 -run "TestTUI" ./...

  build:
    needs: [test-portable, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build -o hid2xbox.exe -ldflags="-s -w" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hid2xbox
          path: hid2xbox.exe
